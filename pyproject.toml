[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insty"
version = "0.1.2"
description = "基于VISA协议的统一仪器控制库"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Quincy" }]
keywords = ["visa", "instrument-control", "scpi", "automation", "test-measurement"]
dependencies = [
    "pyvisa",
    "typing-extensions>=4.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Quincy-Zh/insty"
Repository = "https://github.com/Quincy-Zh/insty"
"Bug Tracker" = "https://github.com/Quincy-Zh/insty/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["insty*"]
exclude = ["tests", "tests.*"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
# BLE001/S110/S112：硬件 I/O 防御与多后端回退的有意 except Exception 风格
ignore = ["BLE001", "S110", "S112"]
